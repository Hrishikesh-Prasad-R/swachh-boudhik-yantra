# rtabmap.yaml  —  Stage 4A: Manual RTAB-Map Mapping
# ─────────────────────────────────────────────────────────────────────────────
# RTAB-Map parameters for indoor RGB-D mapping with wheel odometry.
# All major parameters are documented with their purpose and trade-offs.
#
# Reference:
#   http://wiki.ros.org/rtabmap_ros/Tutorials/SetupOnYourRobot
#   http://official-rtab-map-forum.67519.x6.nabble.com/
#
# Tuning guide:
#   - For larger environments: increase Mem/STMSize
#   - For faster CPU:          increase Kp/MaxFeatures
#   - For better loop closure: decrease Rtabmap/LoopThr
#   - For smaller map files:   decrease Grid/CellSize (but increases RAM)
#
# OVERLAPPING MAP FIX:
#   The main causes of overlapping / ghost maps are:
#   1. Old TF frames still active in RViz2 — always restart RViz2 with SLAM
#   2. Loop closure not triggering fast enough — fixed by DetectionRate=2, LinearUpdate=0.05
#   3. Proximity detection disabled — fixed by ProximityBySpace=true + ProximityPathMaxNeighbors=10
#   4. Poor graph optimization — fixed by Optimizer/Robust=true + Iterations=100
#
# Usage:
#   ros2 launch vacuum_slam slam.launch.py
#   ros2 launch vacuum_slam slam.launch.py environment:=office
# ─────────────────────────────────────────────────────────────────────────────

rtabmap:
  ros__parameters:

    # ── Frame IDs ──────────────────────────────────────────────────────────
    # Must match the TF tree from vacuum_description/_sensors.xacro
    frame_id:             base_footprint    # robot base frame (ground plane)
    odom_frame_id:        odom              # published by diff_drive_controller
    map_frame_id:         map               # RTAB-Map publishes map -> odom TF
    sensor_transform:     ""               # use TF (camera_link auto-detected)

    # ── Input mode ─────────────────────────────────────────────────────────
    subscribe_depth:      true
    subscribe_rgb:        true
    subscribe_rgbd:       false
    subscribe_scan:       false
    subscribe_scan_cloud: false
    subscribe_odom_info:  false

    qos_image:            2       # 2 = Best Effort / Volatile (drops old buffered frames)
    qos_camera_info:      2       # 2 = Best Effort / Volatile

    # ── Synchronisation ────────────────────────────────────────────────────
    # approx_sync: allows small timestamp differences between RGB and depth.
    # Required for simulation because Gazebo bridge may introduce minor jitter.
    approx_sync:              true
    approx_sync_max_interval: 0.05   # seconds — increased for DDS bridge jitter

    # Queue size: increase if dropping frames (at cost of RAM)
    queue_size: 10

    # ── TF timing tolerance ─────────────────────────────────────────────────
    # wait_for_transform: how long RTAB-Map waits for TF before giving up.
    # Increase from default 0.2s to tolerate residual sim/wall clock drift.
    wait_for_transform:    0.5      # seconds
    tf_delay:              0.05     # seconds — delay before querying TF (helps jitter)
    tf_tolerance:          0.1      # seconds — temporal tolerance for TF lookup

    # ── Database ───────────────────────────────────────────────────────────
    # RTAB-Map persists its map to an SQLite database.
    # Default: ~/.ros/rtabmap.db (overridden per-launch via argument)
    database_path: ~/.ros/rtabmap.db

    # ── Memory management ──────────────────────────────────────────────────
    # Short-term memory (STM) holds the most recent keyframes.
    # Older keyframes are moved to long-term memory (LTM) for loop closure.
    #
    # TUNING NOTE: Increase STMSize for larger rooms (>10m span).
    # 50 keyframes @ 0.05m/keyframe = 2.5m radius of "active" memory.
    # For apartment mapping, 50–100 is better.
    Mem/STMSize:               "50"     # ↑ from 30 — more active memory = better LC
    Mem/RehearsalSimilarity:   "0.45"   # similarity threshold for memory rehearsal
    Mem/BadSignaturesIgnored:  "false"  # keep poor-quality keyframes (safer)
    Mem/InitWMWithAllNodes:    "false"  # don't pre-load entire DB into working memory
    Mem/IncrementalMemory:     "true"   # add new keyframes continuously

    # ── Detection rate ─────────────────────────────────────────────────────
    # ENTERPRISE SETTING: 2 Hz is the recommended production value.
    # At 1 Hz, a robot rotating at 30°/s creates 30° gaps between keyframes.
    # At 2 Hz, gaps are 15° — sufficient for D435i's 69° horizontal FOV.
    #
    # Do NOT go above 3 Hz unless you have a very fast CPU and SSD.
    Rtabmap/DetectionRate:     "2"      # ↑ from 1 Hz — catches loop closures faster
    Rtabmap/TimeThr:           "700"    # ms — max time per update (0=unlimited, but unsafe)
    Rtabmap/MemoryThr:         "0"      # MB — 0 = no memory limit

    # ── Loop closure ───────────────────────────────────────────────────────
    # Threshold for accepting a loop closure hypothesis.
    # Lower = more aggressive (more false positives risk).
    # Higher = more conservative (may miss valid loop closures).
    #
    # ENTERPRISE SETTING:
    #   Production robots use 0.11–0.15 for indoor environments.
    #   Values below 0.10 cause false loop closures in symmetric rooms.
    #   Values above 0.15 miss valid closures in texture-poor areas.
    Rtabmap/LoopThr:           "0.11"   # loop closure acceptance threshold
    Rtabmap/LoopRatio:         "0.9"    # require top candidate to be 90% of 2nd best
                                        # This prevents false loop closures in symmetric rooms

    # Feature re-extraction improves loop closure quality at cost of CPU.
    # Set to true if you see "ghost" rooms (false positive loop closures).
    RGBD/LoopClosureReextractFeatures: "true"   # ↑ from false — verifies LC with fresh features

    # ── Motion update thresholds ───────────────────────────────────────────
    # Only create a new keyframe when the robot has moved sufficiently.
    #
    # ENTERPRISE SETTING:
    #   0.05m + 0.052rad (3°) = dense keyframes. Better coverage for loop closure.
    #   0.10m + 0.087rad (5°) = default. Sparser, faster, but misses thin-corridor LC.
    #
    # For vacuum robots (slow, methodical movement): use 0.05/0.052
    # For fast robots (>0.5 m/s): use 0.10/0.087
    RGBD/LinearUpdate:         "0.05"   # ↓ from 0.1m — denser keyframes for better LC
    RGBD/AngularUpdate:        "0.052"  # ↓ from 0.087 rad — ~3° per keyframe

    # ── Proximity detection ────────────────────────────────────────────────
    # Proximity detection finds loop closures to spatially nearby nodes
    # even before the global loop closure hypothesis is triggered.
    # This is the main fix for "overlapping corridors" — it catches local
    # drift before it accumulates into a visible ghost.
    #
    # ENTERPRISE SETTING: Always enable for indoor robots.
    RGBD/ProximityBySpace:          "true"   # detect nearby previous locations
    RGBD/ProximityMaxGraphDepth:    "0"      # 0 = search all graph nodes (unlimited)
    RGBD/ProximityPathMaxNeighbors: "10"     # ↑ check 10 neighbours in proximity graph
    RGBD/ProximityAngle:            "45"     # degrees — proximity angle tolerance
    RGBD/OptimizeMaxError:          "3.0"    # reject graph optimizations with >3x error
                                             # (prevents catastrophic map jumps)

    # ── Graph optimization ─────────────────────────────────────────────────
    # ENTERPRISE SETTING: GTSAM (2) > g2o (1) > TORO (0)
    # GTSAM gives the most consistent map after loop closures.
    # Use g2o if GTSAM is not installed.
    Optimizer/Strategy:        "1"      # 1=g2o (robust, standard). 2=GTSAM (best, if available)
    Optimizer/Iterations:      "100"    # ↑ from default 20 — more iterations = more consistent map
    Optimizer/Robust:          "true"   # use robust kernel (Huber) to reject outlier LC
    Optimizer/VarianceIgnored: "false"  # use odometry covariance (more accurate pose graph)

    # ── Feature detection ──────────────────────────────────────────────────
    # ORB (6) is recommended for real-time use (faster than SURF/SIFT).
    # For better quality at cost of CPU: use SURF (0) or AKAZE (7).
    #
    # ENTERPRISE SETTING:
    #   D435i has excellent texture. Use ORB with 1000 features.
    #   SURF (0) is patented and slower but more robust in low-texture areas.
    #   AKAZE (7) is a good middle ground: patent-free, robust, ~2x slower than ORB.
    Kp/DetectorStrategy:       "6"      # 0=SURF, 6=ORB, 7=AKAZE, 8=FAST/BRIEF
    Kp/MaxFeatures:            "1000"   # ↑ from 500 — D435i gives rich texture, use it
    Kp/MaxDepth:               "4.0"    # m — ignore features beyond this depth
    Kp/MinDepth:               "0.2"    # ↑ from 0.1m — avoids noisy near-field depth

    # ── Occupancy grid (2D map) ────────────────────────────────────────────
    # Used by Nav2 in Stage 5.
    #
    # OVERLAPPING MAP FIX:
    #   Grid/RayTracing=true + Grid/3D=false + Grid/NormalsSegmentation=false
    #   is the correct combo for a differential-drive vacuum robot.
    #
    # The "overlapping" appearance is often Grid/MaxGroundHeight too low:
    #   Robot base is ~15cm off floor. Obstacle legs at 5cm are classified
    #   as ground → disappear from map → navigation crashes into table legs.
    Grid/3D:                   "false"  # false = 2D occupancy grid for Nav2
    Grid/RayTracing:           "true"   # mark free space using ray casting
    Grid/CellSize:             "0.05"   # m — 5cm resolution (standard for Nav2)
    Grid/MaxObstacleHeight:    "2.0"    # m — ignore obstacles above this height
    Grid/MinGroundHeight:      "-0.1"   # m — ignore points below ground
    Grid/MaxGroundHeight:      "0.20"   # ↑ from 0.15m — catches low obstacles (chair legs, cables)
    Grid/FlatObstacleDetected: "true"   # detect horizontal surfaces as obstacles
    Grid/NormalsSegmentation:  "false"  # disable normals-based floor detection
    Grid/ClusterRadius:        "0.1"    # m — cluster nearby obstacle points (cleaner map)
    Grid/MinClusterSize:       "20"     # min points per cluster (removes sensor noise)
    Grid/FootprintRadius:      "0.0"    # 0 = use robot_radius from Nav2 (don't duplicate)

    # ── Visual odometry fallback ───────────────────────────────────────────
    # RTAB-Map can refine odometry using visual features.
    # We use wheel odometry as primary; visual is cross-check only.
    Vis/MinInliers:            "15"     # min visual feature matches for a valid frame
    Vis/InlierDistance:        "0.1"    # m — max reprojection error for inliers

    # ── ICP refinement (disabled — no lidar) ──────────────────────────────
    Icp/MaxTranslation:        "0.1"
    Icp/MaxRotation:           "0.1"

    # ── Publishing ─────────────────────────────────────────────────────────
    # These control what RTAB-Map publishes to ROS2 topics.
    RGBD/CreateOccupancyGrid:  "true"   # publish /rtabmap/map (OccupancyGrid)
    RGBD/ProximityBySpace:     "true"   # detect nearby previous locations
    RGBD/ProximityMaxGraphDepth: "0"

    # ── Logging ────────────────────────────────────────────────────────────
    Rtabmap/StartNewMapOnLoopClosure: "false"
    Rtabmap/SaveWMState:       "false"

    # ── Odometry noise tolerance ───────────────────────────────────────────
    # Helps RTAB-Map handle the Gaussian noise we inject in Stage 2.
    Odom/Strategy:             "0"      # 0=Frame-to-Map, 1=Frame-to-Frame
    Odom/ResetCountdown:       "1"
    OdomF2M/MaxSize:           "1000"   # max points in the local map
