[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini — Swachh Boudhik Yantra Robot Test Suite
# ─────────────────────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose by default — show individual test names and durations
addopts =
    -v
    --tb=short
    --strict-markers
    --durations=10

# Custom markers — every tier of the test matrix
markers =
    unit:            Pure logic, no ROS, no hardware, runs in <1s
    integration:     Mocked-ROS component interaction tests
    system:          Full-stack Gazebo simulation tests
    performance:     Timing and throughput benchmarks
    stress:          High-load and resource-exhaustion tests
    endurance:       Long-running stability tests (hours)
    regression:      Guard against specific known-bad behaviours
    safety:          Safety-critical constraint validation
    security:        Input sanitisation and privilege checks
    fault_injection: Deliberate failure injection tests
    simulation:      Gazebo-dependent tests
    hardware:        Real-hardware-required tests
    field:           Field deployment tests
    acceptance:      End-to-end acceptance criteria

# Treat unregistered markers as errors
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
