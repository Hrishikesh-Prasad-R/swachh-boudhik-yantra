# map_server_params.yaml  —  Stage 5: Static Map Server Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Loads a pre-saved occupancy grid into Nav2's map_server node.
#
# The yaml_filename is set at launch time by nav2_localization.launch.py
# via LaunchConfiguration('map_path'). This file only holds non-path params.
#
# Usage:
#   nav2_map_server map_server --ros-args
#     -p yaml_filename:=~/maps/stage5/apartment.yaml
#
# Map generated by:
#   ./save_map.sh apartment     → ~/maps/stage5/apartment.pgm + .yaml
# ─────────────────────────────────────────────────────────────────────────────

map_server:
  ros__parameters:
    yaml_filename: ""     # set at runtime via launch argument — do not hardcode
    frame_id: map
    topic_name: /map
    # Transient local QoS — AMCL and costmaps subscribe with TRANSIENT_LOCAL
    # to catch the map published once at startup.
