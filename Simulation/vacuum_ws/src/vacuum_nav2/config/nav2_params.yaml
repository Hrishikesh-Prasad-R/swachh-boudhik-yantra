# nav2_params.yaml  —  Stage 4B: Nav2 for Autonomous Exploration
# ──────────────────────────────────────────────────────────────────────────────
# Nav2 configuration for Swachh Boudhik Yantra vacuum robot.
#
# Robot specs:
#   Kinematics  : Differential drive (non-holonomic)
#   Footprint   : Circle, radius 0.18 m
#   Max linear  : 0.30 m/s  (slow — indoor vacuum robot)
#   Max angular : 1.0  rad/s
#   Map source  : RTAB-Map (/rtabmap/map) — updated in real-time during exploration
#   Localisation: RTAB-Map provides map→odom TF (no AMCL needed in Stage 4B)
#
# Planners:
#   Global : SmacPlannerHybrid (Hybrid A* — optimal for non-holonomic)
#   Local  : MPPIController (smooth, tight-space capable)
#
# Stage 5 will switch to AMCL localisation on a pre-built map.
# ──────────────────────────────────────────────────────────────────────────────

# ── BT Navigator ──────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Custom exploration behavior tree (Stage 4B)
    # Falls back to recovery spins instead of aborting on path failure.
    default_nav_to_pose_bt_xml: ""  # set at runtime in nav2.launch.py
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ── Controller Server (local planning — MPPI) ──────────────────────────────────
controller_server:
  ros__parameters:
    controller_frequency: 20.0         # Hz — local plan update rate
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5   # m — must move at least this much per interval
      movement_time_allowance: 10.0   # s  — time allowed to make required movement

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30         # m  — position tolerance (generous for exploration)
      yaw_goal_tolerance: 0.50        # rad — heading tolerance

    # MPPI Controller — smooth, non-holonomic, handles tight indoor spaces well
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.0         # non-holonomic: no lateral velocity
      wz_std: 0.4
      vx_max: 0.30        # m/s — matches robot linear limit
      vx_min: -0.10       # m/s — allow small reverse
      vy_max: 0.0
      wz_max: 1.0         # rad/s — matches robot angular limit
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
        mode: 0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_smoothing_factor: 0.1

# ── Planner Server (global planning — Smac Hybrid A*) ──────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.30                    # m — goal position tolerance
      allow_unknown: true               # CRITICAL for frontier exploration
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0            # s — abort planning if over this time
      motion_model_for_search: "DUBIN"  # non-holonomic: Dubins curves
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: true
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.25      # m — tight turns for small robot
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ── Behavior Server (recovery behaviors) ──────────────────────────────────────
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    back_up:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ── Smoother Server ───────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── Velocity Smoother ─────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.0]       # [vx, vy, wz] — matches robot limits
    min_velocity: [-0.10, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── Global Costmap ────────────────────────────────────────────────────────────
# Uses RTAB-Map's live occupancy grid as the static layer base.
# The obstacle layer adds real-time depth data from the RealSense camera.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      robot_radius: 0.18               # m — vacuum robot circular footprint
      resolution: 0.05
      track_unknown_space: true        # required for frontier exploration
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d/StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /rtabmap/map        # RTAB-Map updates this continuously
      obstacle_layer:
        plugin: "nav2_costmap_2d/ObstacleLayer"
        enabled: true
        observation_sources: laser_scan
        laser_scan:
          topic: /scan_from_depth      # laser scan generated from depth image
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d/InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35         # m — robot radius (0.18) + 0.17 safety margin
      always_send_full_costmap: true

# ── Local Costmap ─────────────────────────────────────────────────────────────
# Rolling window around the robot for local obstacle avoidance.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 4                         # m — local map width
      height: 4                        # m — local map height
      resolution: 0.05
      robot_radius: 0.18
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d/ObstacleLayer"
        enabled: true
        observation_sources: laser_scan
        laser_scan:
          topic: /scan_from_depth
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d/InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

# ── Map Server ────────────────────────────────────────────────────────────────
# Not used in Stage 4B — RTAB-Map provides the live map directly.
# Will be used in Stage 5 (localisation on pre-built map).
map_server:
  ros__parameters:
    yaml_filename: ""

# ── Map Saver ─────────────────────────────────────────────────────────────────
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ── Lifecycle Manager ─────────────────────────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names:
      - bt_navigator
      - planner_server
      - controller_server
      - behavior_server
      - smoother_server
      - velocity_smoother
