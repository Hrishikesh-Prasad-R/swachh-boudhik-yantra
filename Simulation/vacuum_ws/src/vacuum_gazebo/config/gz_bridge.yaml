# gz_bridge.yaml — Stage 2
# ─────────────────────────────────────────────────────────────────────────────
# ROS ↔ Gazebo Harmonic topic bridge configuration
# Used by: ros_gz_bridge/parameter_bridge in vacuum_bringup/launch/sim.launch.py
#
# Stage 2 note:
#   gz_ros2_control now owns all robot I/O topics as native ROS2:
#     /cmd_vel      → subscribed by diff_drive_controller (ROS2)
#     /odom         → published by diff_drive_controller (ROS2)
#     /tf           → published by diff_drive_controller (ROS2)
#     /joint_states → published by joint_state_broadcaster (ROS2)
#
#   ONLY /clock still needs bridging because Gazebo's physics clock
#   must synchronise all ROS2 nodes that use use_sim_time: true.
# ─────────────────────────────────────────────────────────────────────────────

# Simulation clock — required for use_sim_time in ALL ROS2 nodes
- ros_topic_name: "/clock"
  gz_topic_name:  "/clock"
  ros_type_name:  "rosgraph_msgs/msg/Clock"
  gz_type_name:   "gz.msgs.Clock"
  direction: GZ_TO_ROS
